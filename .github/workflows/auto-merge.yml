name: Parkiva automatic merge

on:
  workflow_run:
    workflows: [Parkiva CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: parkiva-automatic-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code runs with write permissions.
      # Never check out PR code or download workflow_run artifacts here.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/auto-merge.cjs');
            await run({ github, context, core });
